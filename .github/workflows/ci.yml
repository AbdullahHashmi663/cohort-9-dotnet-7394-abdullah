name: Build & Test CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore TaskManager.slnx

    - name: Build Backend
      run: dotnet build TaskManager.slnx --no-restore -c Release

    - name: Run xUnit Unit Tests
      run: dotnet test TaskManager.Tests/TaskManager.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test_results.trx"

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: TaskManager.UI/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd TaskManager.UI
        npm ci

    - name: Build React Frontend
      run: |
        cd TaskManager.UI
        npm run build
