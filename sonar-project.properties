# SonarQube Configuration
sonar.projectKey=TaskManager
sonar.projectName=Task Management Tool
sonar.projectVersion=1.0

# Source directories
sonar.sources=TaskManager.API,TaskManager.UI/src
sonar.tests=TaskManager.Tests

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/Migrations/**

# C# specific
sonar.cs.opencover.reportsPaths=TaskManager.Tests/TestResults/coverage.opencover.xml

# JavaScript specific
sonar.javascript.lcov.reportPaths=TaskManager.UI/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
